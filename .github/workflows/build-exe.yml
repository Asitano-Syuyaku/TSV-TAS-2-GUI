name: Build Windows executables

# Builds the four release packages (normal and Dopagaki editions, Japanese and
# English) on Windows. Run it from the Actions tab; the zips come out as
# workflow artifacts, ready to attach to a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label in the package names (e.g. v2)"
        required: true
        default: v2
      main_ref:
        description: "Branch or tag for the normal edition"
        required: true
        default: main
      dopagaki_ref:
        description: "Branch or tag for the Dopagaki edition"
        required: true
        default: dopagaki
      run_tests:
        description: "Also run the test suite once per edition"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [main, dopagaki]
        language: [ja, en]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.edition == 'main' && inputs.main_ref || inputs.dopagaki_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      # Reported, but a failing or stuck test does not hide the build; -v names
      # the test that was running if the time limit is hit.
      - name: Run tests
        if: inputs.run_tests && matrix.language == 'ja'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m unittest discover -v -s tests -p "test_*.py"

      - name: Build package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.language }}" = ja ]; then launcher=main_jp; readme=README.md; else launcher=main_en; readme=README_EN.md; fi
          if [ "${{ matrix.edition }}" = main ]; then edition=""; else edition="-dopagaki"; fi
          name="TSV-TAS-2-GUI${edition}-${{ matrix.language }}"
          package="TSV-TAS-2-GUI${edition}-${{ inputs.version }}-${{ matrix.language }}"
          # The launchers import converter_gui and editor/ from python_to_exe/.
          python -m PyInstaller --noconsole --onefile --name "$name" --paths python_to_exe \
            --add-data "assets/icons/png:assets/icons/png" "python_to_exe/${launcher}.py"
          # A launcher-only exe starts and fails with ModuleNotFoundError: refuse it.
          for module in converter_gui app_settings editor.window editor.grid tkinter; do
            grep -q "'$module'" "build/$name/PYZ-00.toc" || { echo "::error::$module is not bundled"; exit 1; }
          done
          # The exe runs the converters beside it with the installed Python 3.
          mkdir -p "release/$package"
          cp "dist/$name.exe" tsv-tas.py nx-tas-to-tsv-tas.py ftp_config.json "$readme" "release/$package/"
          (cd release && 7z a -tzip "$package.zip" "$package" > /dev/null)
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package }}
          path: release/${{ steps.package.outputs.package }}.zip
          if-no-files-found: error
